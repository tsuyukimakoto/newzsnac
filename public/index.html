<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newzsnac</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="masthead">
      <div class="wordmark">NEWZ<span>SNAC</span></div>
      <div class="edition">PERSONAL EDITION <b>№ 001</b></div>
      <label class="search"><span>⌕</span><input id="search" placeholder="記事を検索  /" aria-label="記事を検索"></label>
      <button class="new-count" id="new-count" hidden>新着 <b>0</b>件</button>
    </div>
    <main class="workspace">
      <aside class="sources" aria-label="情報源">
        <div class="section-label">SOURCES</div>
        <nav id="sources">
          <button class="source active" id="filter-all"><span>すべての記事</span><b id="total-count">0</b></button>
          <button class="source" id="filter-pending"><i class="dot gold"></i><span>準備中</span><b id="pending-count">0</b></button>
          <button class="source" id="filter-failed"><i class="dot rust"></i><span>取得失敗</span><b id="failed-count">0</b></button>
          <div class="rule"></div>
          <button class="source" id="filter-saved"><span>保存済み</span><b id="saved-count">0</b></button>
          <button class="source" id="filter-interested"><span>気になった</span><b id="interested-count">0</b></button>
          <button class="source" id="filter-recommended"><span>読むべきかも？</span><b id="recommended-count">0</b></button>
          <div class="rule"></div>
          <div id="source-list"></div>
        </nav>
        <button class="discover">＋ 情報源を追加</button>
        <div class="local-status"><i id="runtime-dot"></i><span>LOCAL<br><small id="runtime-status">SQLite を確認中</small></span></div>
      </aside>
      <section class="stream" aria-label="記事一覧">
        <header class="stream-head"><div><span class="section-label" id="stream-kicker">INBOX</span><h1 id="stream-title">今日の読みもの</h1></div><button id="sort">おすすめ順⌄</button></header>
        <div class="stream-meta">
          <span id="unread-count">未読 0</span>
          <label class="read-toggle"><input id="hide-read" type="checkbox">既読を隠す</label>
          <span id="visible-count">0件を表示</span>
          <span id="reading-time">約 0分</span>
          <span id="stream-error" class="stream-error" aria-live="polite"></span>
        </div>
        <div id="article-list" class="article-list" role="listbox" tabindex="0"><div id="article-spacer"></div></div>
        <div id="empty" class="empty"><b id="empty-title">収集した記事はまだありません</b><span id="empty-detail">左下の「情報源を追加」から購読先を登録してください。</span></div>
      </section>
      <article class="reader" id="reader" aria-live="polite">
        <div class="reader-empty"><span class="big-mark">N</span><p>記事を選ぶと、ここに本文を表示します。</p><kbd>j</kbd><span>で次の記事へ</span></div>
      </article>
    </main>
    <footer class="keybar"><span><kbd>j</kbd><kbd>k</kbd> 移動</span><span><kbd>Space</kbd> 精読</span><span><kbd>i</kbd> 気になった</span><span><kbd>s</kbd> 保存</span><span><kbd>u</kbd> 未読</span><span><kbd>t</kbd> 翻訳</span><span><kbd>o</kbd> 原文</span><span><kbd>/</kbd> 検索</span><span class="mode" id="mode">高速モード</span></footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
